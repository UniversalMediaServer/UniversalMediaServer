#----------------------------------------------------------------------------
# Profile for Sony Bravia EX725 TVs.
# See DefaultRenderer.conf for descriptions of all the available options.
#

RendererName = Sony Bravia EX725
RendererIcon = braviaex.png

# ============================================================================
# This renderer has sent the following string/s:
#
# friendlyName=BRAVIA KDL-40EX725
# modelName=KDL-40EX725
# ============================================================================
#

UpnpDetailsSearch = KDL-\d{2}EX725
LoadingPriority = 1

SeekByTime = true
TranscodeAudio = WAV
DLNALocalizationRequired = true
DefaultVBVBufSize = true
CreateDLNATreeFaster = true
AccurateDLNAOrgPN = true
MuxNonMod4Resolution = true
HalveBitrate = true

# Our Bravia EX-specific notes:
# DTS is not supported. In MP4 the set stays silent on a DTS track while the video plays.
# H.264 within AVI containers is not supported, nor is GMC or QPEL.
# WMV is supported, but not with 5.1 audio.
# Apple Lossless Audio Codec (ALAC) is not supported.
# Matroska is not advertised by these sets at all, so an MKV is filtered out of the
# browse listing rather than merely failing to play.
# E-AC3 is decoded from MP4, including 7.1, and is reported on screen as Dolby Digital
# Plus, so it should not be transcoded. The set's HDMI input does not accept E-AC3 as a
# bitstream, but decoding a file and accepting a bitstream are different capabilities.
# 3D auto-engages from the H.264 frame_packing_arrangement SEI in the elementary stream
# only; the Matroska StereoMode tag is ignored, and a remux to MPEG-TS drops it anyway.

# Supported video formats:
Supported = f:mp4      v:h264|mp4               a:aac-lc|ac3|eac3       m:video/mp4
Supported = f:mpegps   v:h264|mp4|mpeg1|mpeg2   a:aac-lc|ac3|lpcm|mpa   m:video/mpeg
Supported = f:mpegts   v:h264|mp4|mpeg1|mpeg2   a:aac-lc|ac3|lpcm|mpa   m:video/vnd.dlna.mpeg-tts

# Supported audio formats:
Supported = f:wav     n:6   m:audio/wav        s:48000   a:dts|lpcm
Supported = f:wav     n:2   m:audio/wav        s:48000
Supported = f:mp3     n:2   m:audio/mpeg
Supported = f:m4a     n:2   m:audio/x-m4a                a:(?!alac).+
Supported = f:wma     n:2   m:audio/x-ms-wma
Supported = f:atrac   n:2   m:audio/x-oma
