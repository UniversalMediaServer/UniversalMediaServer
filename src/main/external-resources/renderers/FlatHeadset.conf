#----------------------------------------------------------------------------
# Profile for Flat Headset.
#
# Flat Headset advertises its manufacturer, model name and panel resolution in
# its UPnP description. Codec support is decided dynamically by its player,
# so this profile intentionally doesn't guess static codec support.
#----------------------------------------------------------------------------

RendererName = Flat Headset
UpnpDetailsSearch = ^.*KDE contributors.*Flat Headset.*FlatHeadset/1\.0 Panel/[0-9]+x[0-9]+.*$
LoadingPriority = 2
Output3DFormat = sbsl
MaxVideoWidth = 3840
MaxVideoHeight = 2160
